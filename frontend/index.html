<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#101a22"
    />

    <meta
      name="description"
      content="TaskForge — A focused workspace to manage projects, teams, and tasks."
    />

    <title>TaskForge — Team Workspace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750;800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  </head>

  <body>
    <script>
      try {
        var theme = localStorage.getItem('taskforge-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101a22' : '#f5f8f8';
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
